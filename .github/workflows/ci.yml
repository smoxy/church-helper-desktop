name: CI
on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Il job rust gira solo su Linux: i rami #[cfg(target_os = "macos")] (es. gli
  # shortcut .webloc di download.rs) non verrebbero mai compilati prima di una
  # release. Niente fmt: e' indipendente dalla piattaforma e lo copre gia' il
  # job rust.
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Self-test dello script di versione usato dai job di build.yml, sui tre
  # sistemi delle release: GNU (ubuntu), Git Bash (windows) e BSD con la
  # /bin/bash 3.2 di sistema (macOS, /bin e /usr/bin davanti nel PATH).
  ci-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Self-test version-from-tag.sh
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PATH="/bin:/usr/bin:$PATH"
            /bin/bash --version | head -1
            /bin/bash scripts/ci/version-from-tag.test.sh
          else
            bash --version | head -1
            bash scripts/ci/version-from-tag.test.sh
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  # Le run su tag possono ripristinare solo cache create sul tag stesso (mai
  # esistenti) o sul default branch: senza questo job ogni release ricompila
  # tutte le dipendenze Rust da zero. Compila in release su main con le stesse
  # shared-key di build.yml, senza bundling ne' firma (--no-bundle).
  warm-release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shared-key: release-windows
            targets: x86_64-pc-windows-msvc
            build-args: '--target x86_64-pc-windows-msvc'
          - os: ubuntu-latest
            shared-key: release-linux
            targets: ''
            build-args: ''
          # Build universal come release-macos: compila entrambi i target.
          - os: macos-latest
            shared-key: release-macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'
          shared-key: ${{ matrix.shared-key }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build (warm cache, no bundle)
        env:
          CHURCH_HELPER_API_BASE: ${{ vars.CHURCH_HELPER_API_BASE }}
        run: npm run tauri build -- ${{ matrix.build-args }} --no-bundle
