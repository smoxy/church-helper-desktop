name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # shared-key: riusa la cache scaldata dal job warm-release-cache di
      # ci.yml su main (i tag possono leggere solo cache del default branch).
      # save-if: su tag il salvataggio e' inutile (nessuna run futura puo'
      # leggere cache create su un tag).
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'
          shared-key: release-windows
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install frontend dependencies
        run: npm ci

      # Logica condivisa da tutti i job di release (formato del tag, rc solo
      # fuori da main, stabili solo su main, riscrittura dei file di versione):
      # vedi scripts/ci/version-from-tag.sh e il suo self-test
      # scripts/ci/version-from-tag.test.sh.
      - name: Update version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: bash scripts/ci/version-from-tag.sh

      - name: Check updater signing key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # Compare via env vars (not interpolating the secret values
        # directly into the script) so their contents are never spliced
        # into shell code.
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY non configurato nei secrets del repository: questa release NON includera' artefatti di auto-update firmati (nessun .sig, nessuna voce in latest.json). Vedi UPDATER_SETUP.md per completare il setup. La build degli installer procede comunque normalmente."
            jq '.bundle.createUpdaterArtifacts = false' ./src-tauri/tauri.conf.json > tmp.json && mv tmp.json ./src-tauri/tauri.conf.json
          fi

      # Le build di prova non ricevono la chiave di firma degli update: con
      # createUpdaterArtifacts attivo tauri fallirebbe a fine bundle ("A public
      # key has been found, but no private key"). Si spengono solo qui.
      - name: Disable updater artifacts (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      # Plain test build when NOT releasing (e.g. manual workflow_dispatch on
      # a branch, no tag): verifies the build works without touching any
      # GitHub Release.
      - name: Build Tauri App (test build, no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          CHURCH_HELPER_API_BASE: ${{ vars.CHURCH_HELPER_API_BASE }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      # Real release build: signs the updater artifacts (if
      # TAURI_SIGNING_PRIVATE_KEY is configured, see the check step above)
      # and publishes every bundle (msi/nsis) plus the merged latest.json
      # updater manifest as assets on the GitHub Release for this tag.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CHURCH_HELPER_API_BASE: ${{ vars.CHURCH_HELPER_API_BASE }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'church-helper-desktop ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc

  release-linux:
    # Runs after release-windows so the two jobs never race to merge the
    # same latest.json asset on the same GitHub Release concurrently.
    needs: release-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'
          shared-key: release-linux
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install frontend dependencies
        run: npm ci

      # Logica condivisa da tutti i job di release (formato del tag, rc solo
      # fuori da main, stabili solo su main, riscrittura dei file di versione):
      # vedi scripts/ci/version-from-tag.sh e il suo self-test
      # scripts/ci/version-from-tag.test.sh.
      - name: Update version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sudo apt-get install -y jq
          bash scripts/ci/version-from-tag.sh

      - name: Check updater signing key
        if: startsWith(github.ref, 'refs/tags/v')
        # Compare via env vars (not interpolating the secret values
        # directly into the script) so their contents are never spliced
        # into shell code.
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY non configurato nei secrets del repository: questa release NON includera' artefatti di auto-update firmati (nessun .sig, nessuna voce in latest.json). Vedi UPDATER_SETUP.md per completare il setup. La build degli installer procede comunque normalmente."
            jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          fi

      # Le build di prova non ricevono la chiave di firma degli update: con
      # createUpdaterArtifacts attivo tauri fallirebbe a fine bundle ("A public
      # key has been found, but no private key"). Si spengono solo qui.
      - name: Disable updater artifacts (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      # Plain test build when NOT releasing (e.g. manual workflow_dispatch on
      # a branch, no tag): verifies the build works without touching any
      # GitHub Release.
      - name: Build Linux Deb (test build, no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          CHURCH_HELPER_API_BASE: ${{ vars.CHURCH_HELPER_API_BASE }}
        run: npm run tauri build -- --bundles deb

      # Real release build: signs the updater artifact (if
      # TAURI_SIGNING_PRIVATE_KEY is configured, see the check step above)
      # and publishes the .deb plus the merged latest.json updater manifest
      # (merged with the Windows job's entries, see `needs:` above) as
      # assets on the GitHub Release for this tag.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CHURCH_HELPER_API_BASE: ${{ vars.CHURCH_HELPER_API_BASE }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'church-helper-desktop ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          includeUpdaterJson: true
          args: --bundles deb

  release-macos:
    # Dopo release-linux (che a sua volta segue release-windows): tauri-action
    # scarica il latest.json gia' presente sulla release, ci aggiunge le voci
    # della propria piattaforma e lo ricarica. Job in parallelo si
    # sovrascriverebbero le voci a vicenda; la catena seriale garantisce che
    # questo job parta dal latest.json con le voci windows e linux. Costo: se un
    # job precedente fallisce, la build macOS viene saltata.
    needs: release-linux
    runs-on: macos-latest
    env:
      # Solo flag "configurato si'/no" calcolati a livello di job (mai il valore
      # dei secrets): scelgono quale variante dello step di build/publish gira.
      # Firma Developer ID + notarizzazione solo con TUTTI i secrets Apple
      # configurati; altrimenti firma ad-hoc (bundle.macOS.signingIdentity "-"
      # in tauri.conf.json). Le variabili APPLE_* non vanno mai passate vuote a
      # tauri: un APPLE_CERTIFICATE vuoto lo fa provare a importare il
      # certificato e la build fallisce.
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      # Build universal (Apple Silicon + Intel in un unico .app): servono
      # entrambi i target Rust.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Stessa logica di release-windows: shared-key scaldata da
      # warm-release-cache di ci.yml su main, nessun salvataggio su tag.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'
          shared-key: release-macos
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install frontend dependencies
        run: npm ci

      # Logica condivisa da tutti i job di release (formato del tag, rc solo
      # fuori da main, stabili solo su main, riscrittura dei file di versione):
      # vedi scripts/ci/version-from-tag.sh e il suo self-test
      # scripts/ci/version-from-tag.test.sh.
      - name: Update version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/ci/version-from-tag.sh

      - name: Check updater signing key
        if: startsWith(github.ref, 'refs/tags/v')
        # Compare via env vars (not interpolating the secret values
        # directly into the script) so their contents are never spliced
        # into shell code.
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY non configurato nei secrets del repository: questa release NON includera' artefatti di auto-update firmati (nessun .sig, nessuna voce in latest.json). Vedi UPDATER_SETUP.md per completare il setup. La build degli installer procede comunque normalmente."
            jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          fi

      # Rende visibile nel riepilogo della run quale firma macOS viene usata.
      # Come sopra: solo flag booleani via env, mai i valori dei secrets.
      - name: Check Apple signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          if [ "$APPLE_SIGNING_ENABLED" = "true" ]; then
            echo "::notice::Secrets Apple configurati: build macOS firmata con Developer ID e notarizzata."
            exit 0
          fi
          MISSING=""
          CONFIGURED=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            flag="HAS_$name"
            if [ "${!flag}" = "true" ]; then
              CONFIGURED="$CONFIGURED $name"
            else
              MISSING="$MISSING $name"
            fi
          done
          if [ -n "$CONFIGURED" ]; then
            echo "::warning::Secrets Apple configurati solo in parte (mancano:$MISSING): la firma Developer ID richiede tutti e sei, questa build macOS ripiega sulla firma ad-hoc."
          fi
          echo "::notice::Build macOS firmata ad-hoc e NON notarizzata (secrets Apple Developer ID assenti o incompleti). Gatekeeper blocca il primo avvio dell'app scaricata: l'utente deve aprirla da Impostazioni di Sistema > Privacy e sicurezza > Apri comunque (fino a macOS 14 basta anche tasto destro > Apri). Per la firma completa configurare APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD e APPLE_TEAM_ID."

      # Le build di prova non ricevono la chiave di firma degli update: con
      # createUpdaterArtifacts attivo tauri fallirebbe a fine bundle ("A public
      # key has been found, but no private key"). Si spengono solo qui.
      - name: Disable updater artifacts (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      # Plain test build when NOT releasing (e.g. manual workflow_dispatch on
      # a branch, no tag): verifies the build works without touching any
      # GitHub Release. Firma ad-hoc, nessuna notarizzazione.
      - name: Build macOS app (test build, no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          CHURCH_HELPER_API_BASE: ${{ vars.CHURCH_HELPER_API_BASE }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      # Real release build, variante senza secrets Apple: .app firmato ad-hoc
      # (signingIdentity "-" da tauri.conf.json), nessuna variabile APPLE_*.
      # Pubblica .dmg e .app.tar.gz (+ .sig se TAURI_SIGNING_PRIVATE_KEY e'
      # configurato) e aggiunge a latest.json le voci darwin-aarch64 e
      # darwin-x86_64, entrambe sull'unico bundle universal.
      - name: Build and publish release (ad-hoc signing)
        if: startsWith(github.ref, 'refs/tags/v') && env.APPLE_SIGNING_ENABLED != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CHURCH_HELPER_API_BASE: ${{ vars.CHURCH_HELPER_API_BASE }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'church-helper-desktop ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          includeUpdaterJson: true
          args: --target universal-apple-darwin --bundles app,dmg

      # Real release build, variante con tutti i secrets Apple: il bundler
      # importa il certificato in un keychain temporaneo, firma con
      # APPLE_SIGNING_IDENTITY (che sovrascrive il "-" di tauri.conf.json) e
      # notarizza con APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID. Stessi artefatti
      # e stesse voci di latest.json della variante ad-hoc.
      - name: Build and publish release (Developer ID signing + notarization)
        if: startsWith(github.ref, 'refs/tags/v') && env.APPLE_SIGNING_ENABLED == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CHURCH_HELPER_API_BASE: ${{ vars.CHURCH_HELPER_API_BASE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'church-helper-desktop ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          includeUpdaterJson: true
          args: --target universal-apple-darwin --bundles app,dmg
